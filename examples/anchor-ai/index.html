<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anchor AI — 3D Particle Tree & MotionSites UI</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Three.js (r128) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg: #0c0d0e;
      --bg-header: #0e0f11;
      --text: #ffffff;
      --text-muted: #8e8e93;
      --text-dim: #55555c;
      --card-bg: #131417;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00d2ff;
      --accent-blue: #3a7bd5;
      --radius-card: 28px;
      --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      user-select: none;
    }

    /* Top Categories Filter Header */
    header {
      width: 100%;
      padding: 24px 32px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(12, 13, 14, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .categories-nav {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 36px;
      list-style: none;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .categories-nav::-webkit-scrollbar { display: none; }

    .category-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: color 0.2s ease;
      cursor: pointer;
      white-space: nowrap;
    }
    .category-link:hover, .category-link.active {
      color: #ffffff;
    }

    /* Showcase Carousel & Cards Container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 60px;
      position: relative;
    }

    .cards-viewport {
      width: 100%;
      max-width: 1440px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      position: relative;
    }

    /* Side Preview Peeks (Left & Right) */
    .side-card {
      width: 240px;
      height: 480px;
      border-radius: var(--radius-card);
      overflow: hidden;
      opacity: 0.45;
      transform: scale(0.92);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      cursor: pointer;
    }
    .side-card:hover {
      opacity: 0.75;
      transform: scale(0.95);
    }
    .side-card .card-thumb {
      flex: 1;
      border-radius: var(--radius-card);
      background-size: cover;
      background-position: center;
      border: 1px solid var(--card-border);
    }

    /* Centerpiece Active Card (Anchor AI) */
    .center-card-wrapper {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .main-canvas-card {
      width: 100%;
      height: 520px;
      background: #000000;
      border-radius: var(--radius-card);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 
        0 4px 20px rgba(0, 0, 0, 0.6),
        0 24px 60px -12px rgba(0, 168, 255, 0.15);
      cursor: grab;
    }
    .main-canvas-card:active {
      cursor: grabbing;
    }

    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Card Details Footer */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
    }

    .card-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .copy-icon-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 6px;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }
    .copy-icon-btn:hover {
      transform: scale(1.1);
      opacity: 0.8;
    }

    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card-title {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .card-subtext {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Interactive Controls Overlay */
    .interaction-pill {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(14, 15, 18, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .pulse-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    /* Toast notification when prompt copied */
    .toast-msg {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #ffffff;
      color: #000000;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Top Category Bar -->
  <header>
    <ul class="categories-nav">
      <li><a class="category-link active">Ai</a></li>
      <li><a class="category-link">Fintech</a></li>
      <li><a class="category-link">Technology</a></li>
      <li><a class="category-link">Travel</a></li>
      <li><a class="category-link">Wellness</a></li>
    </ul>
  </header>

  <main>
    <div class="cards-viewport">
      <!-- Left Peek Card (Glassmorphism Cube / Architecture) -->
      <div class="side-card">
        <div class="card-thumb" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80');"></div>
      </div>

      <!-- Centerpiece Active Card: ANCHOR AI -->
      <div class="center-card-wrapper">
        <div class="main-canvas-card">
          <!-- Live 3D WebGL Canvas -->
          <div id="three-canvas"></div>

          <!-- Overlay Hint -->
          <div class="interaction-pill">
            <div class="pulse-dot"></div>
            <span>Interactive 3D Particle Tree</span>
          </div>
        </div>

        <!-- Footer Info Matching Screenshot -->
        <div class="card-footer">
          <div class="card-header-left">
            <!-- Copy Icon SVG -->
            <button class="copy-icon-btn" id="copy-btn" title="Copy Anchor AI Prompt">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="3" ry="3"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
            <div class="card-meta">
              <h2 class="card-title">Anchor AI</h2>
              <span class="card-subtext">Portfolio</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Peek Card (Golden Clouds / Warm Identity) -->
      <div class="side-card">
        <div class="card-thumb" style="background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=600&q=80');"></div>
      </div>
    </div>
  </main>

  <div class="toast-msg" id="toast">
    <span>✓</span>
    <span>Anchor AI Prompt Copied to Clipboard</span>
  </div>

  <!-- ==========================================================================
       THREE.JS: PROCEDURAL LUMINESCENT 3D PARTICLE TREE & RIPPLE ENGINE
       ========================================================================== -->
  <script>
    const container = document.getElementById('three-canvas');

    // 1. Scene, Camera, Renderer
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000208, 0.035);

    const camera = new THREE.PerspectiveCamera(
      45,
      container.clientWidth / container.clientHeight,
      0.1,
      1000
    );
    camera.position.set(0, 1.4, 6.8);
    camera.lookAt(0, 1.2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // 2. Procedural Soft Glow Particle Sprite Texture (Zero external images)
    function createGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.2, 'rgba(0,210,255,0.85)');
      grad.addColorStop(0.5, 'rgba(30,100,255,0.4)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }
    const particleTexture = createGlowTexture();

    // 3. Mathematical 3D Particle Tree (Fountain & Canopy Structure)
    const PARTICLE_COUNT = 32000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    const originalPos = new Float32Array(PARTICLE_COUNT * 3);

    const cyanColor = new THREE.Color(0x00d2ff);
    const deepBlue = new THREE.Color(0x1d3557);
    const electricBlue = new THREE.Color(0x0077b6);
    const whiteSpark = new THREE.Color(0xffffff);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const idx = i * 3;
      const progress = Math.random(); // 0 (base) to 1 (canopy top)
      
      let x, y, z;
      const color = new THREE.Color();

      if (progress < 0.25) {
        // TRUNK & BASE COLUMN
        const trunkProg = progress / 0.25;
        y = trunkProg * 1.3;
        const radius = 0.08 + (trunkProg * 0.15) + (Math.random() - 0.5) * 0.08;
        const angle = Math.random() * Math.PI * 2 + trunkProg * 8.0;
        x = Math.cos(angle) * radius;
        z = Math.sin(angle) * radius;

        color.lerpColors(deepBlue, cyanColor, trunkProg);
      } else {
        // CANOPY MUSHROOM & VOLUMETRIC EXPANSION
        const canopyProg = (progress - 0.25) / 0.75;
        y = 1.3 + Math.sin(canopyProg * Math.PI * 0.5) * 1.5;

        // Radial mushroom curve
        const expansion = Math.sin(canopyProg * Math.PI) * 1.75 + canopyProg * 0.6;
        const angle = Math.random() * Math.PI * 2;
        const spreadRadius = expansion * (0.3 + Math.random() * 0.75);

        x = Math.cos(angle) * spreadRadius;
        z = Math.sin(angle) * spreadRadius;

        // Color gradient to bright cyan and white tips
        if (Math.random() > 0.85) {
          color.copy(whiteSpark);
        } else {
          color.lerpColors(cyanColor, electricBlue, canopyProg);
        }
      }

      positions[idx] = x;
      positions[idx + 1] = y;
      positions[idx + 2] = z;

      originalPos[idx] = x;
      originalPos[idx + 1] = y;
      originalPos[idx + 2] = z;

      colors[idx] = color.r;
      colors[idx + 1] = color.g;
      colors[idx + 2] = color.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 0.045,
      map: particleTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      vertexColors: true
    });

    const particleTree = new THREE.Points(geometry, material);
    scene.add(particleTree);

    // 4. Concentric Liquid Ripple Rings On Floor (As in the screenshot)
    const ripples = [];
    const RIPPLE_COUNT = 6;
    for (let i = 0; i < RIPPLE_COUNT; i++) {
      const ringGeo = new THREE.RingGeometry(0.3, 0.33, 64);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x00a8ff,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.6,
        blending: THREE.AdditiveBlending
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI / 2;
      ring.position.y = -0.02;
      ring.userData = {
        phase: (i / RIPPLE_COUNT),
        baseScale: (i / RIPPLE_COUNT) * 4.2
      };
      scene.add(ring);
      ripples.push(ring);
    }

    // 5. Mouse Interaction & Spring Easing
    let targetRotY = 0;
    let targetRotX = 0;
    let isMouseDown = false;
    let prevMouseX = 0, prevMouseY = 0;

    container.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    });

    window.addEventListener('mouseup', () => { isMouseDown = false; });

    container.addEventListener('mousemove', (e) => {
      const rect = container.getBoundingClientRect();
      const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      const ny = -(((e.clientY - rect.top) / rect.height) * 2 - 1);

      if (!isMouseDown) {
        targetRotY = nx * 0.35;
        targetRotX = ny * 0.15;
      } else {
        const dx = e.clientX - prevMouseX;
        const dy = e.clientY - prevMouseY;
        particleTree.rotation.y += dx * 0.007;
        particleTree.rotation.x += dy * 0.007;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      }
    });

    // Handle Resize
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // 6. 60 FPS Animation Loop
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      // Continuous subtle tree breathing & rotation
      if (!isMouseDown) {
        particleTree.rotation.y += (targetRotY - particleTree.rotation.y) * 0.04;
        particleTree.rotation.x += (targetRotX - particleTree.rotation.x) * 0.04;
      }
      particleTree.rotation.y += 0.0035;

      // Particle vertex wave oscillation
      const posArr = geometry.attributes.position.array;
      for (let i = 0; i < PARTICLE_COUNT; i += 3) {
        const idx = i * 3;
        const ox = originalPos[idx];
        const oy = originalPos[idx + 1];
        const oz = originalPos[idx + 2];

        // Wave ripple through the tree
        const wave = Math.sin(time * 2.5 + oy * 3.0) * 0.04;
        posArr[idx] = ox + (ox * wave);
        posArr[idx + 2] = oz + (oz * wave);
      }
      geometry.attributes.position.needsUpdate = true;

      // Animate Concentric Liquid Floor Ripples
      ripples.forEach((ring) => {
        ring.userData.phase += 0.005;
        if (ring.userData.phase > 1) ring.userData.phase = 0;

        const currentScale = ring.userData.phase * 5.2 + 0.3;
        ring.scale.set(currentScale, currentScale, 1);
        ring.material.opacity = Math.sin(ring.userData.phase * Math.PI) * 0.45;
      });

      renderer.render(scene, camera);
    }
    animate();

    // Copy Prompt Button Feedback
    const copyBtn = document.getElementById('copy-btn');
    const toast = document.getElementById('toast');
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText("Anchor AI — 3D Luminescent Particle Tree & Fluid Concentric Ripple Ecosystem");
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    });
  </script>
</body>
</html>
